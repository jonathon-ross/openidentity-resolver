services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: openidentity
      POSTGRES_USER: openidentity
      POSTGRES_PASSWORD: openidentity
    ports:
      - "5432:5432"
    volumes:
      - openidentity-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openidentity -d openidentity"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_DB: openidentity_test
      POSTGRES_USER: openidentity
      POSTGRES_PASSWORD: openidentity
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openidentity -d openidentity_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  openidentity-postgres:
